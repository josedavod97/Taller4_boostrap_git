<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña | Undergraun</title>
    <link rel="icon" type="image/png" href="../assets/assets/img/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Undergraun</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRecover" aria-controls="navbarRecover" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarRecover">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Ingresar</a></li>
            <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="recuperar.html">Recuperar</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="d-flex align-items-center min-vh-100 py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
              <div class="card-body p-4">
                <div class="text-center mb-4">
                  <i class="bi bi-envelope-open-fill fs-1 text-warning"></i>
                  <h2 class="h4 mt-3">Recuperar contraseña</h2>
                  <p class="text-muted mb-0">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
                </div>
                <form>
                  <div class="form-floating mb-3">
                    <input type="email" class="form-control is-invalid" id="recoverEmail" placeholder="correo@ejemplo.com" autocomplete="email" required />
                    <label for="recoverEmail">Correo electrónico</label>
                    <div class="invalid-feedback">Correo no encontrado. Verifica tu dirección e inténtalo nuevamente.</div>
                  </div>
                  <button type="submit" class="btn btn-warning w-100 mb-3">Enviar enlace</button>
                </form>
                <div class="d-flex justify-content-between small">
                  <a href="login.html">Volver al ingreso</a>
                  <a href="registro.html">Crear cuenta</a>
                </div>
              </div>
            </div>
            <div class="text-center mt-3 text-muted small">
              <span><i class="bi bi-clock-history"></i> Proceso rápido y seguro.</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
