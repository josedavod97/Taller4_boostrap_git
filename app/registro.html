<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse | Undergraun</title>
  <link rel="icon" type="image/png" href="../assets/assets/img/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>

<body class="bg-light">
  <script>
    const authUser = JSON.parse(localStorage.getItem('undergraunUser') || 'null');
    if (authUser) {
      window.location.href = authUser.role === 'admin' ? 'admin.html' : 'cliente.html';
    }
  </script>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Undergraun</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRegister"
        aria-controls="navbarRegister" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarRegister">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Ingresar</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="registro.html">Registrarse</a></li>
          <li class="nav-item"><a class="nav-link" href="recuperar.html">Recuperar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="d-flex align-items-center min-vh-100 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill fs-1 text-success"></i>
                <h2 class="h4 mt-3">Crea tu cuenta</h2>
                <p class="text-muted mb-0">Regístrate para disfrutar de los lanzamientos y ofertas de Undergraun.</p>
              </div>
              <form id="registerForm">
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="firstName" placeholder="Nombre"
                        autocomplete="given-name" required />
                      <label for="firstName">Nombre</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="lastName" placeholder="Apellidos"
                        autocomplete="family-name" required />
                      <label for="lastName">Apellidos</label>
                    </div>
                  </div>
                </div>
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="document" placeholder="Cédula" autocomplete="off"
                        required />
                      <label for="document">Cédula</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com"
                        autocomplete="email" required />
                      <label for="email">Correo electrónico</label>
                    </div>
                  </div>
                </div>
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="tel" class="form-control" id="phone" placeholder="Teléfono" autocomplete="tel"
                        required />
                      <label for="phone">Teléfono</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="city" placeholder="Ciudad"
                        autocomplete="address-level2" required />
                      <label for="city">Ciudad</label>
                    </div>
                  </div>
                </div>
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="password" class="form-control" id="password" placeholder="Contraseña"
                        autocomplete="new-password" required />
                      <label for="password">Contraseña</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="password" class="form-control" id="confirmPassword"
                        placeholder="Confirmar contraseña" autocomplete="new-password" required />
                      <label for="confirmPassword">Confirmar contraseña</label>
                    </div>
                  </div>
                </div>
                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="termsCheck" required />
                  <label class="form-check-label" for="termsCheck">Acepto los términos y condiciones</label>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">Crear cuenta</button>
              </form>
              <div class="d-flex justify-content-between small">
                <a href="login.html">¿Ya tienes cuenta?</a>
                <a href="recuperar.html">Recuperar contraseña</a>
              </div>
            </div>
          </div>
          <div class="text-center mt-3 text-muted small">
            <span><i class="bi bi-lock-fill"></i> Registro seguro con Bootstrap.</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombres = document.getElementById('firstName').value.trim();
        const apellidos = document.getElementById('lastName').value.trim();
        const documento = document.getElementById('document').value.trim();
        const email = document.getElementById('email').value.trim();
        const telefono = document.getElementById('phone').value.trim();
        const ciudad = document.getElementById('city').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          alert('Las contraseñas no coinciden.');
          return;
        }

        const payload = { documento, nombres, apellidos, email, telefono, ciudad, estado: 'activo', password };

        try {
          const res = await fetch('http://localhost:3000/clientes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const user = await res.json();
            localStorage.setItem('undergraunUser', JSON.stringify({
              id: user.id_cliente,
              name: `${user.nombres} ${user.apellidos}`,
              email: user.email,
              phone: user.telefono,
              city: user.ciudad,
              document: user.documento,
              role: 'cliente'
            }));
            alert('Registro completado correctamente');
            window.location.href = 'cliente.html';
          } else {
            const data = await res.json();
            alert('Error al registrar: ' + (data.error || JSON.stringify(data)));
          }
        } catch (err) {
          alert('Error de conexión: ' + err.message);
        }
      });
    }
  </script>
</body>

</html>
